<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Institute Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Header Design */
        header {
            width: 100%;
            height: 150px;
            background: linear-gradient(
                to right,
                #0785f5,
                #00b9ed
            );
            color: white;
            text-align: center;
            padding: 32px 10px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        header p {
            font-size: 14px;
        }

        /* Gallery Section */
        .gallery {
            width: 100%;
            padding: 0 4px;
        }

        .gallery img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            display: block;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            header {
                height: 130px;
                padding: 28px 5px;
            }

            header h1 {
                font-size: 27px;
            }

            .gallery img {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Our Institute Gallery</h1>

        <p>
            Training | Practical Labs | Events | Students
        </p>
    </header>

    <!-- Gallery -->
    <section class="gallery">
        <img src="computer_lab.jpg" alt="Institute Classroom">
        
    </section>

</body>
</html>

    
</body>
</html>
