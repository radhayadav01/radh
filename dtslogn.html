<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rama Technical Degree College - Online Exam</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #e3f2fd;
        }

        /* Header Design */
        header {
            width: 100%;
            background: linear-gradient(90deg, #111c38, #204dcc);
            color: white;
            text-align: center;
            padding: 16px 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 15px;
        }

        /* Login Form */
        .login-container {
            width: 520px;
            max-width: 95%;
            background: white;
            margin: 24px auto;
            padding: 38px 23px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .login-container h2 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #111;
        }

        .info {
            color: #6480a5;
            font-size: 13px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* Labels */
        label {
            display: block;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #111;
        }

        /* Input and Select */
        input, select {
            width: 100%;
            height: 43px;
            padding: 10px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #2454cc;
            box-shadow: 0 0 5px rgba(36,84,204,0.2);
        }

        /* Login Button */
        button {
            width: 100%;
            padding: 13px;
            background: #204dcc;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #142f87;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            header h1 {
                font-size: 20px;
            }

            header p {
                font-size: 12px;
            }

            .login-container {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Rama Technical Degree College - Online Exam</h1>
        <p>Computer Fundamental | MS Word | MS Excel | PowerPoint | Tally Prime</p>
    </header>

    <!-- Login Form -->
    <div class="login-container">

        <h2>Student Login</h2>

        <p class="info">
            Password सही होने पर ही exam start होगा।
            एक Name + Roll Number से test केवल एक बार होगा।
        </p>

        <form>

            <label>Student Name</label>
            <input type="text" placeholder="Student Name" required>

            <label>Father's Name</label>
            <input type="text" placeholder="Father Name" required>

            <label>Course</label>
            <select required>
                <option value="">-- Course Select करें --</option>
                <option>Computer Fundamental</option>
                <option>MS Word</option>
                <option>MS Excel</option>
                <option>PowerPoint</option>
                <option>Tally Prime</option>
            </select>

            <label>Roll Number</label>
            <input type="text" placeholder="जैसे NK1015" required>

            <label>Password</label>
            <input type="password" placeholder="Password" required>

            <button type="submit">Login & Start Exam</button>

        </form>

    </div>

</body>
</html>

</body>
</html>
